<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Reports | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { poppins: ['Poppins', 'sans-serif'], }, colors: { navy: { 900: '#070B19', 800: '#0B132B', 700: '#1C2541', 600: '#2A365C', }, teal: { 400: '#2DD4BF', 500: '#14B8A6', 600: '#0D9488', } } } } }
    </script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
    <script src="js/admin.js"></script>
    <script>requireAdminAuth();</script>
</head>
<body class="bg-navy-900 text-white font-poppins flex min-h-screen">

    <!-- SIDEBAR -->
    <aside id="adminSidebar" class="fixed inset-y-0 left-0 w-64 bg-navy-800 border-r border-white/10 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
        <div class="h-20 flex items-center justify-between px-6 border-b border-white/10">
            <div class="flex items-center gap-2"><i class="ph-fill ph-shield-check text-teal-400 text-2xl"></i><span class="font-bold text-lg">Admin Portal</span></div>
            <button onclick="toggleMobileSidebar()" class="lg:hidden text-gray-400"><i class="ph-bold ph-x text-xl"></i></button>
        </div>
        <div class="p-4 flex-grow space-y-2">
            <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl font-medium transition-colors"><i class="ph-fill ph-squares-four text-lg"></i> Dashboard</a>
            <!-- Active State -->
            <a href="admin-reports.html" class="flex items-center gap-3 px-4 py-3 bg-teal-500/10 text-teal-400 rounded-xl font-medium border border-teal-500/20"><i class="ph-fill ph-folder text-lg"></i> Manage Reports</a>
            <a href="admin-users.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl font-medium transition-colors"><i class="ph-fill ph-users text-lg"></i> Manage Users</a>
        </div>
        <div class="p-4 border-t border-white/10">
            <button onclick="localStorage.removeItem('adminLoggedIn'); window.location.replace('admin-login.html');" class="w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-xl font-medium transition-colors"><i class="ph-bold ph-sign-out text-lg"></i> Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-grow lg:ml-64 p-4 lg:p-8">
        
        <div class="lg:hidden flex justify-between items-center mb-6 bg-navy-800 p-4 rounded-2xl border border-white/10">
            <span class="font-bold">Admin Portal</span>
            <button onclick="toggleMobileSidebar()" class="text-white"><i class="ph-bold ph-list text-2xl"></i></button>
        </div>

        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Manage Reports</h1>
            <p class="text-gray-400">Review, approve, and resolve campus items.</p>
        </div>

        <!-- Filters -->
        <div class="bg-navy-800 border border-white/10 rounded-2xl p-4 mb-6 flex flex-col md:flex-row gap-4">
            <input type="text" id="search" placeholder="Search items..." class="bg-navy-900 border border-white/10 rounded-xl px-4 py-2 text-sm flex-grow focus:outline-none focus:border-teal-500">
            <select id="filterType" class="bg-navy-900 border border-white/10 rounded-xl px-4 py-2 text-sm focus:outline-none">
                <option value="All">All Types</option><option value="LOST">Lost</option><option value="FOUND">Found</option>
            </select>
            <select id="filterStatus" class="bg-navy-900 border border-white/10 rounded-xl px-4 py-2 text-sm focus:outline-none">
                <option value="All">All Statuses</option><option value="Pending">Pending</option><option value="Approved">Approved</option><option value="Resolved">Resolved</option><option value="Rejected">Rejected</option>
            </select>
        </div>

        <!-- Table -->
        <div class="bg-navy-800 border border-white/10 rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-navy-900/50 text-gray-400">
                        <tr>
                            <th class="px-6 py-4 font-medium">Item</th>
                            <th class="px-6 py-4 font-medium">Type</th>
                            <th class="px-6 py-4 font-medium">Location</th>
                            <th class="px-6 py-4 font-medium">Status</th>
                            <th class="px-6 py-4 font-medium text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="reportsTbody" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- DETAILS MODAL (Acts as the View Details functionality) -->
    <div id="detailsModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-navy-900/90 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-navy-800 border border-white/10 rounded-3xl overflow-hidden shadow-2xl w-full max-w-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-white/10 flex justify-between items-center bg-navy-900">
                <h3 class="text-xl font-bold">Report Details</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar">
                <img id="mImage" src="" class="w-full h-64 object-cover rounded-xl mb-6">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <div id="mCategory" class="text-xs text-teal-400 uppercase tracking-wider mb-1 font-medium"></div>
                        <h2 id="mName" class="text-2xl font-bold"></h2>
                    </div>
                    <span id="mType" class="px-3 py-1 rounded-full text-xs font-bold text-white"></span>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-6 text-sm text-gray-300">
                    <p><strong class="text-gray-500 block">Location</strong> <span id="mLocation"></span></p>
                    <p><strong class="text-gray-500 block">Date</strong> <span id="mDate"></span></p>
                    <p><strong class="text-gray-500 block">Reporter ID</strong> <span id="mUserId"></span></p>
                    <p><strong class="text-gray-500 block">Current Status</strong> <span id="mStatus" class="font-bold"></span></p>
                </div>
                <div class="bg-navy-900 p-4 rounded-xl border border-white/5">
                    <p class="text-gray-400 text-sm leading-relaxed" id="mDesc"></p>
                </div>
            </div>
            <div class="p-6 border-t border-white/10 bg-navy-900 flex flex-wrap gap-3" id="mActions">
                <!-- Buttons injected via JS -->
            </div>
        </div>
    </div>

    <script>
        let currentReports = [];
        let activeReportId = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadTable();
            document.getElementById('search').addEventListener('input', loadTable);
            document.getElementById('filterType').addEventListener('change', loadTable);
            document.getElementById('filterStatus').addEventListener('change', loadTable);
        });

        function loadTable() {
            currentReports = getReports();
            const search = document.getElementById('search').value.toLowerCase();
            const fType = document.getElementById('filterType').value;
            const fStatus = document.getElementById('filterStatus').value;
            
            const tbody = document.getElementById('reportsTbody');
            tbody.innerHTML = '';

            const filtered = currentReports.filter(r => {
                const matchSearch = r.itemName.toLowerCase().includes(search) || r.location.toLowerCase().includes(search);
                const matchType = fType === 'All' || r.type === fType;
                const matchStatus = fStatus === 'All' || r.status === fStatus;
                return matchSearch && matchType && matchStatus;
            });

            filtered.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition-colors";
                tr.innerHTML = `
                    <td class="px-6 py-4 flex items-center gap-3">
                        <img src="${r.image}" class="w-10 h-10 rounded-lg object-cover">
                        <div><p class="font-medium text-white">${r.itemName}</p><p class="text-xs text-gray-500">${r.category}</p></div>
                    </td>
                    <td class="px-6 py-4"><span class="${r.type==='LOST'?'text-red-400':'text-teal-400'} font-bold text-xs">${r.type}</span></td>
                    <td class="px-6 py-4 text-gray-400">${r.location}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 border rounded text-xs font-bold uppercase ${getStatusBadgeClass(r.status)}">${r.status}</span></td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="openDetails('${r.id}')" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs font-medium transition-colors">Details</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openDetails(id) {
            const r = currentReports.find(x => x.id === id);
            if(!r) return;
            activeReportId = r.id;

            document.getElementById('mImage').src = r.image;
            document.getElementById('mCategory').textContent = r.category;
            document.getElementById('mName').textContent = r.itemName;
            
            const typeBadge = document.getElementById('mType');
            typeBadge.textContent = r.type;
            typeBadge.className = `px-3 py-1 rounded-full text-xs font-bold text-white ${r.type==='LOST'?'bg-red-500':'bg-teal-500'}`;

            document.getElementById('mLocation').textContent = r.location;
            document.getElementById('mDate').textContent = r.date;
            document.getElementById('mUserId').textContent = r.userId || 'Unknown';
            document.getElementById('mStatus').textContent = r.status.toUpperCase();
            document.getElementById('mStatus').className = `font-bold text-xs ${getStatusBadgeClass(r.status).replace('border','').replace('bg-','')}`;
            document.getElementById('mDesc').textContent = r.description;

            // Generate Action Buttons based on status
            const actionsDiv = document.getElementById('mActions');
            actionsDiv.innerHTML = '';
            
            if(r.status === 'Pending') {
                actionsDiv.innerHTML += `<button onclick="doAction('Approved')" class="px-4 py-2 bg-teal-500 hover:bg-teal-400 text-white text-sm font-medium rounded-xl transition-colors">Approve</button>`;
                actionsDiv.innerHTML += `<button onclick="doAction('Rejected')" class="px-4 py-2 bg-white/5 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-xl text-sm font-medium transition-colors">Reject</button>`;
            }
            if(r.status === 'Approved') {
                actionsDiv.innerHTML += `<button onclick="doAction('Resolved')" class="px-4 py-2 bg-blue-500 hover:bg-blue-400 text-white text-sm font-medium rounded-xl transition-colors">Mark Resolved</button>`;
            }
            actionsDiv.innerHTML += `<button onclick="doDelete()" class="px-4 py-2 bg-transparent hover:bg-red-500/20 text-gray-400 hover:text-red-400 rounded-xl text-sm font-medium transition-colors ml-auto">Delete Report</button>`;

            document.getElementById('detailsModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.add('hidden');
            activeReportId = null;
        }

        function doAction(newStatus) {
            updateReportStatus(activeReportId, newStatus);
            closeModal();
            loadTable();
        }

        function doDelete() {
            if(confirm('Are you sure you want to delete this report? This cannot be undone.')) {
                deleteReport(activeReportId);
                closeModal();
                loadTable();
            }
        }
    </script>
</body>
</html>
