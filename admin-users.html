<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { poppins: ['Poppins', 'sans-serif'], }, colors: { navy: { 900: '#070B19', 800: '#0B132B', 700: '#1C2541', 600: '#2A365C', }, teal: { 400: '#2DD4BF', 500: '#14B8A6', 600: '#0D9488', } } } } }
    </script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
    <script src="js/admin.js"></script>
    <script>requireAdminAuth();</script>
</head>
<body class="bg-navy-900 text-white font-poppins flex min-h-screen">

    <!-- SIDEBAR -->
    <aside id="adminSidebar" class="fixed inset-y-0 left-0 w-64 bg-navy-800 border-r border-white/10 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
        <div class="h-20 flex items-center justify-between px-6 border-b border-white/10">
            <div class="flex items-center gap-2"><i class="ph-fill ph-shield-check text-teal-400 text-2xl"></i><span class="font-bold text-lg">Admin Portal</span></div>
            <button onclick="toggleMobileSidebar()" class="lg:hidden text-gray-400"><i class="ph-bold ph-x text-xl"></i></button>
        </div>
        <div class="p-4 flex-grow space-y-2">
            <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl font-medium transition-colors"><i class="ph-fill ph-squares-four text-lg"></i> Dashboard</a>
            <a href="admin-reports.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl font-medium transition-colors"><i class="ph-fill ph-folder text-lg"></i> Manage Reports</a>
            <!-- Active State -->
            <a href="admin-users.html" class="flex items-center gap-3 px-4 py-3 bg-teal-500/10 text-teal-400 rounded-xl font-medium border border-teal-500/20"><i class="ph-fill ph-users text-lg"></i> Manage Users</a>
        </div>
        <div class="p-4 border-t border-white/10">
           <button onclick="localStorage.removeItem('adminLoggedIn'); window.location.replace('admin-login.html');" class="w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-xl font-medium transition-colors"><i class="ph-bold ph-sign-out text-lg"></i> Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-grow lg:ml-64 p-4 lg:p-8">
        
        <div class="lg:hidden flex justify-between items-center mb-6 bg-navy-800 p-4 rounded-2xl border border-white/10">
            <span class="font-bold">Admin Portal</span>
            <button onclick="toggleMobileSidebar()" class="text-white"><i class="ph-bold ph-list text-2xl"></i></button>
        </div>

        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Manage Users</h1>
            <p class="text-gray-400">View registered students, block accounts, or remove users.</p>
        </div>

        <!-- Table -->
        <div class="bg-navy-800 border border-white/10 rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-navy-900/50 text-gray-400">
                        <tr>
                            <th class="px-6 py-4 font-medium">User Profile</th>
                            <th class="px-6 py-4 font-medium">Roll Number</th>
                            <th class="px-6 py-4 font-medium">Reports</th>
                            <th class="px-6 py-4 font-medium">Status</th>
                            <th class="px-6 py-4 font-medium text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTbody" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', loadUsers);

        function loadUsers() {
            const users = getUsers();
            const reports = getReports();
            const tbody = document.getElementById('usersTbody');
            tbody.innerHTML = '';

            if(users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">No registered users found.</td></tr>`;
                return;
            }

            users.forEach(u => {
                // Ensure default status handles undefined/missing gracefully
                if(!u.status) u.status = 'Active';
                
                const userReportsCount = reports.filter(r => r.userId == u.id).length;
                const isBlocked = u.status === 'Blocked';
                const firstInitial = (u.name && u.name.length > 0) ? u.name.charAt(0).toUpperCase() : 'U';

                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition-colors";
                tr.innerHTML = `
                    <td class="px-6 py-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-teal-500/20 text-teal-400 rounded-full flex items-center justify-center font-bold">${firstInitial}</div>
                        <div><p class="font-medium text-white">${u.name || 'N/A'}</p><p class="text-xs text-gray-500">${u.email || 'N/A'}</p></div>
                    </td>
                    <td class="px-6 py-4 text-gray-400">${u.roll || 'N/A'}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 bg-white/5 rounded text-gray-300 text-xs font-bold">${userReportsCount}</span></td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 border rounded text-xs font-bold uppercase ${isBlocked ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-green-500/20 text-green-400 border-green-500/30'}">${u.status}</span>
                    </td>
                    <td class="px-6 py-4 text-right space-x-2">
                        <button onclick="handleBlock('${u.id}')" class="px-3 py-1.5 ${isBlocked ? 'bg-green-500/10 text-green-400 border-green-500/20' : 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20'} hover:opacity-80 border rounded-lg text-xs font-medium transition-colors">
                            ${isBlocked ? 'Unblock' : 'Block'}
                        </button>
                        <button onclick="handleDelete('${u.id}')" class="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-lg text-xs font-medium transition-colors">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleBlock(id) {
            toggleUserBlock(id);
            loadUsers();
        }

        function handleDelete(id) {
            if(confirm('Are you sure you want to delete this user? All their data will be removed.')) {
                deleteUser(id);
                loadUsers();
            }
        }
    </script>
</body>
</html>
