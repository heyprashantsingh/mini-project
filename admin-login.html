<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | GL Bajaj</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { poppins: ['Poppins', 'sans-serif'], },
                    colors: {
                        navy: { 900: '#070B19', 800: '#0B132B', 700: '#1C2541', 600: '#2A365C', },
                        teal: { 400: '#2DD4BF', 500: '#14B8A6', 600: '#0D9488', }
                    }
                }
            }
        }
    </script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-navy-900 text-white font-poppins flex items-center justify-center min-h-screen relative overflow-hidden">
    
    <!-- Background Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-teal-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md px-4 relative z-10">
        <div class="bg-navy-800/80 backdrop-blur-md border border-white/10 rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex bg-teal-500/20 p-3 rounded-2xl text-teal-400 mb-4">
                    <i class="ph-fill ph-shield-check text-4xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">Admin Portal</h1>
                <p class="text-gray-400 text-sm">Restricted access. Authorized personnel only.</p>
            </div>

            <div id="loginError" class="hidden mb-6 p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm font-medium flex items-center gap-2"></div>

            <form onsubmit="handleAdminLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Admin Email</label>
                    <!-- Pre-filled value hata di gayi hai -->
                    <input type="email" id="email" required class="block w-full px-4 py-3 bg-navy-900 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:ring-2 focus:ring-teal-500/50" placeholder="admin@glbajaj.ac.in">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <!-- Pre-filled value hata di gayi hai -->
                    <input type="password" id="password" required class="block w-full px-4 py-3 bg-navy-900 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:ring-2 focus:ring-teal-500/50" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-3.5 bg-teal-500 hover:bg-teal-400 text-white font-semibold rounded-xl transition-all duration-300 shadow-lg shadow-teal-500/25 hover:-translate-y-0.5 mt-2">
                    Secure Login
                </button>
            </form>
            <div class="mt-6 text-center">
                <a href="index.html" class="text-sm text-gray-400 hover:text-white transition-colors"><i class="ph-bold ph-arrow-left"></i> Return to Main Website</a>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        // Redirect if already logged in securely
        if (localStorage.getItem('adminLoggedIn') === "true") {
            window.location.replace("admin-dashboard.html");
        }
    </script>
</body>
</html>
