<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | GL Bajaj</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { poppins: ['Poppins', 'sans-serif'], },
                    colors: {
                        navy: { 900: '#070B19', 800: '#0B132B', 700: '#1C2541', 600: '#2A365C', },
                        teal: { 400: '#2DD4BF', 500: '#14B8A6', 600: '#0D9488', }
                    }
                }
            }
        }
    </script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
    <script src="js/admin.js"></script>
    <script>requireAdminAuth();</script>
</head>
<body class="bg-navy-900 text-white font-poppins flex min-h-screen">

    <!-- SIDEBAR -->
    <aside id="adminSidebar" class="fixed inset-y-0 left-0 w-64 bg-navy-800 border-r border-white/10 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
        <div class="h-20 flex items-center justify-between px-6 border-b border-white/10">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-shield-check text-teal-400 text-2xl"></i>
                <span class="font-bold text-lg tracking-wide">Admin Portal</span>
            </div>
            <button onclick="toggleMobileSidebar()" class="lg:hidden text-gray-400"><i class="ph-bold ph-x text-xl"></i></button>
        </div>
        <div class="p-4 flex-grow space-y-2">
            <!-- Active State -->
            <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 bg-teal-500/10 text-teal-400 rounded-xl font-medium border border-teal-500/20"><i class="ph-fill ph-squares-four text-lg"></i> Dashboard</a>
            <a href="admin-reports.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl font-medium transition-colors"><i class="ph-fill ph-folder text-lg"></i> Manage Reports</a>
            <a href="admin-users.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl font-medium transition-colors"><i class="ph-fill ph-users text-lg"></i> Manage Users</a>
        </div>
        <div class="p-4 border-t border-white/10">
            <button onclick="localStorage.removeItem('adminLoggedIn'); window.location.replace('admin-login.html');" class="w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-xl font-medium transition-colors"><i class="ph-bold ph-sign-out text-lg"></i> Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-grow lg:ml-64 p-4 lg:p-8">
        
        <!-- Mobile Header -->
        <div class="lg:hidden flex justify-between items-center mb-6 bg-navy-800 p-4 rounded-2xl border border-white/10">
            <span class="font-bold">Admin Portal</span>
            <button onclick="toggleMobileSidebar()" class="text-white"><i class="ph-bold ph-list text-2xl"></i></button>
        </div>

        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Dashboard Overview</h1>
            <p class="text-gray-400">Platform statistics and recent activity.</p>
        </div>

        <!-- STATS -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-10">
            <div class="bg-navy-800 border border-white/10 rounded-2xl p-6 flex items-center gap-4">
                <div class="w-14 h-14 bg-blue-500/20 text-blue-400 rounded-xl flex items-center justify-center text-2xl"><i class="ph-fill ph-users"></i></div>
                <div><p class="text-gray-400 text-sm">Total Users</p><h3 class="text-2xl font-bold" id="statUsers">0</h3></div>
            </div>
            <div class="bg-navy-800 border border-white/10 rounded-2xl p-6 flex items-center gap-4">
                <div class="w-14 h-14 bg-red-500/20 text-red-400 rounded-xl flex items-center justify-center text-2xl"><i class="ph-fill ph-magnifying-glass"></i></div>
                <div><p class="text-gray-400 text-sm">Lost Reports</p><h3 class="text-2xl font-bold" id="statLost">0</h3></div>
            </div>
            <div class="bg-navy-800 border border-white/10 rounded-2xl p-6 flex items-center gap-4">
                <div class="w-14 h-14 bg-teal-500/20 text-teal-400 rounded-xl flex items-center justify-center text-2xl"><i class="ph-fill ph-hand-heart"></i></div>
                <div><p class="text-gray-400 text-sm">Found Reports</p><h3 class="text-2xl font-bold" id="statFound">0</h3></div>
            </div>
            <div class="bg-navy-800 border border-white/10 rounded-2xl p-6 flex items-center gap-4">
                <div class="w-14 h-14 bg-yellow-500/20 text-yellow-400 rounded-xl flex items-center justify-center text-2xl"><i class="ph-fill ph-hourglass"></i></div>
                <div><p class="text-gray-400 text-sm">Pending</p><h3 class="text-2xl font-bold" id="statPending">0</h3></div>
            </div>
            <div class="bg-navy-800 border border-white/10 rounded-2xl p-6 flex items-center gap-4">
                <div class="w-14 h-14 bg-green-500/20 text-green-400 rounded-xl flex items-center justify-center text-2xl"><i class="ph-fill ph-check-circle"></i></div>
                <div><p class="text-gray-400 text-sm">Approved</p><h3 class="text-2xl font-bold" id="statApproved">0</h3></div>
            </div>
            <div class="bg-navy-800 border border-white/10 rounded-2xl p-6 flex items-center gap-4">
                <div class="w-14 h-14 bg-purple-500/20 text-purple-400 rounded-xl flex items-center justify-center text-2xl"><i class="ph-fill ph-check-square-offset"></i></div>
                <div><p class="text-gray-400 text-sm">Resolved</p><h3 class="text-2xl font-bold" id="statResolved">0</h3></div>
            </div>
        </div>

        <!-- RECENT REPORTS -->
        <div class="bg-navy-800 border border-white/10 rounded-2xl overflow-hidden">
            <div class="p-6 border-b border-white/10 flex justify-between items-center">
                <h2 class="text-xl font-bold">Recent Reports</h2>
                <a href="admin-reports.html" class="text-teal-400 text-sm font-medium hover:underline">View All</a>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-navy-900/50 text-gray-400">
                        <tr>
                            <th class="px-6 py-4 font-medium">Item</th>
                            <th class="px-6 py-4 font-medium">Type</th>
                            <th class="px-6 py-4 font-medium">Date</th>
                            <th class="px-6 py-4 font-medium">Status</th>
                        </tr>
                    </thead>
                    <tbody id="recentTable" class="divide-y divide-white/5">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const reports = getReports();
            const users = getUsers();

            // Stats
            document.getElementById('statUsers').textContent = users.length;
            document.getElementById('statLost').textContent = reports.filter(r => r.type === 'LOST').length;
            document.getElementById('statFound').textContent = reports.filter(r => r.type === 'FOUND').length;
            document.getElementById('statPending').textContent = reports.filter(r => r.status === 'Pending').length;
            document.getElementById('statApproved').textContent = reports.filter(r => r.status === 'Approved').length;
            document.getElementById('statResolved').textContent = reports.filter(r => r.status === 'Resolved').length;

            // Recent Table
            const tbody = document.getElementById('recentTable');
            reports.slice(-5).reverse().forEach(r => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition-colors";
                tr.innerHTML = `
                    <td class="px-6 py-4 flex items-center gap-3">
                        <img src="${r.image}" class="w-10 h-10 rounded-lg object-cover">
                        <span class="font-medium text-white">${r.itemName}</span>
                    </td>
                    <td class="px-6 py-4"><span class="${r.type==='LOST'?'text-red-400':'text-teal-400'} font-bold text-xs">${r.type}</span></td>
                    <td class="px-6 py-4 text-gray-400">${r.date}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 border rounded text-xs font-bold uppercase ${getStatusBadgeClass(r.status)}">${r.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
