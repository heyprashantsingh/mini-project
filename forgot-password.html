<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | GL Bajaj Lost & Found</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { poppins: ['Poppins', 'sans-serif'], },
                    colors: {
                        navy: { 900: '#070B19', 800: '#0B132B', 700: '#1C2541', 600: '#2A365C', },
                        teal: { 400: '#2DD4BF', 500: '#14B8A6', 600: '#0D9488', }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #070B19; }
        ::-webkit-scrollbar-thumb { background: #1C2541; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2A365C; }
    </style>
</head>
<body class="bg-navy-800 text-white font-poppins antialiased selection:bg-teal-500 selection:text-white flex flex-col min-h-screen">

    <!-- NAVBAR (Minimal version for Auth Pages) -->
    <nav class="fixed w-full z-50 top-0 transition-all duration-300 bg-navy-900/90 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex-shrink-0 flex items-center gap-2 cursor-pointer group">
                    <div class="bg-teal-500/20 p-2 rounded-xl text-teal-400 group-hover:bg-teal-500 group-hover:text-white transition-all duration-300">
                        <i class="ph-fill ph-magnifying-glass text-2xl"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-xl tracking-wide">Lost<span class="text-teal-400">&</span>Found</span>
                        <span class="text-[9px] text-gray-400 mt-0.5">GL Bajaj Institute of Technology & Management</span>
                    </div>
                </a>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-300 font-medium hover:text-white transition-colors">Home</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-grow pt-32 pb-24 relative flex items-center justify-center">
        <!-- Background Ambient Glow -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-teal-500/10 rounded-full blur-[120px] pointer-events-none"></div>

        <div class="w-full max-w-md px-4 relative z-10">
            <div class="bg-navy-900/80 backdrop-blur-md border border-white/10 rounded-3xl p-8 shadow-2xl">
                
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-white/5 text-teal-400 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="ph-bold ph-key text-3xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-white mb-2">Reset Password</h1>
                    <p class="text-gray-400 text-sm">Enter your college email address and we'll send you a link to reset your password.</p>
                </div>

                <!-- Success Alert Box (Hidden by default) -->
                <div id="resetSuccess" class="hidden mb-6 p-4 bg-teal-500/10 border border-teal-500/20 rounded-xl text-teal-400 text-sm font-medium flex items-center gap-2">
                    <i class="ph-fill ph-check-circle text-lg"></i> Reset link sent to your email!
                </div>

                <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)" class="space-y-5">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">College Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="ph-fill ph-envelope-simple text-gray-400"></i>
                            </div>
                            <input type="email" id="resetEmail" required class="block w-full pl-11 pr-4 py-3 bg-navy-800 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:ring-2 focus:ring-teal-500/50 focus:border-teal-500 transition-all duration-300" placeholder="student@glbitm.ac.in">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3.5 bg-teal-500 hover:bg-teal-400 text-white font-semibold rounded-xl transition-all duration-300 shadow-lg shadow-teal-500/25 hover:shadow-teal-500/40 hover:-translate-y-0.5 mt-2 flex items-center justify-center gap-2">
                        <span>Send Reset Link</span>
                        <i class="ph-bold ph-paper-plane-right"></i>
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-gray-400 text-sm">
                        Remember your password? 
                        <a href="login.html" class="text-teal-400 hover:text-teal-300 font-semibold transition-colors ml-1">Back to Login</a>
                    </p>
                </div>

            </div>
        </div>
    </main>

    <script>
        function handleForgotPassword(event) {
            event.preventDefault();
            const emailInput = document.getElementById('resetEmail');
            const form = document.getElementById('forgotPasswordForm');
            const successBox = document.getElementById('resetSuccess');
            
            // Basic UI simulation for reset
            if(emailInput.value.trim() !== '') {
                form.reset();
                successBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
